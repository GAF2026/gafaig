<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GAFAIG External Embed Test</title>
    <style>
      body {
        font-family: Inter, Arial, sans-serif;
        margin: 40px;
        background: #f7f7f7;
        color: #111;
      }
      .card {
        max-width: 760px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 24px;
        padding: 28px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }
      button {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        background: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      #sdk-result {
        margin-top: 20px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: #fafafa;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 13px;
        line-height: 1.6;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>GAFAIG External Embed Test</h1>
      <p>This simulates a third-party site using production GAFAIG scripts and APIs.</p>

      <h3>Badge</h3>
      <div data-gafaig-badge="GAFAIG-00363095"></div>

      <div class="row">
        <button id="open-gafaig-modal" type="button">
          Open Verification Modal
        </button>

        <button id="test-gafaig-sdk" type="button">
          Test SDK
        </button>
      </div>

      <pre id="sdk-result"></pre>
    </div>

    <script src="http://localhost:3000/sdk/gafaig.v1.js"></script>
    <script src="http://localhost:3000/widget/gafaig-verify.v1.js"></script>

    <script>
      window.addEventListener("load", function () {
        var baseUrl = "https://www.gafaig.com";
        var registryId = "GAFAIG-00363095";
        var resultBox = document.getElementById("sdk-result");

        gafaig.init({
          baseUrl: baseUrl
        });

        document
          .getElementById("open-gafaig-modal")
          .addEventListener("click", function () {
            verifyGAFAIG(registryId, {
              baseUrl: baseUrl
            }).catch(function (error) {
              resultBox.style.display = "block";
              resultBox.textContent =
                error && error.message ? error.message : String(error);
            });
          });

        document
          .getElementById("test-gafaig-sdk")
          .addEventListener("click", function () {
            resultBox.style.display = "block";
            resultBox.textContent = "Loading SDK badge response...";

            gafaig
              .getBadge(registryId, {
                baseUrl: baseUrl
              })
              .then(function (data) {
                resultBox.textContent = JSON.stringify(data, null, 2);
              })
              .catch(function (error) {
                resultBox.textContent =
                  error && error.message ? error.message : String(error);
              });
          });
      });
    </script>
  </body>
</html>
