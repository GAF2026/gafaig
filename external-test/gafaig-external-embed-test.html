<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GAFAIG External Embed Test</title>

    <style>
      body {
        font-family: Inter, Arial, sans-serif;
        margin: 40px;
        background: #f7f7f7;
        color: #111;
      }

      .card {
        max-width: 760px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 24px;
        padding: 28px;
      }

      .row {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      button,
      a.gafaig-test-link {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        background: #fff;
        font-weight: 700;
        cursor: pointer;
        color: #111;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      pre {
        margin-top: 20px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: #fafafa;
        overflow-x: auto;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.6;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>GAFAIG External Embed Test</h1>

      <p>This simulates a third-party site using production GAFAIG scripts and APIs.</p>

      <h3>Badge</h3>
      <div data-gafaig-badge="GAFAIG-00363095"></div>

      <div class="row">
        <button id="open-gafaig-modal" type="button">
          Open Verification Modal
        </button>

        <button id="test-sdk" type="button">
          Test SDK
        </button>
      </div>

      <pre id="sdk-result"></pre>
    </div>

    <script src="https://www.gafaig.com/sdk/gafaig.v1.js"></script>
    <script src="https://www.gafaig.com/widget/gafaig-verify.v1.js"></script>

    <script>
      (function () {
        var BASE_URL = "https://www.gafaig.com";
        var REGISTRY_ID = "GAFAIG-00363095";
        var MAX_ATTEMPTS = 50;
        var ATTEMPT_DELAY_MS = 100;

        function writeResult(value) {
          var resultBox = document.getElementById("sdk-result");
          if (!resultBox) return;

          if (typeof value === "string") {
            resultBox.textContent = value;
            return;
          }

          resultBox.textContent = JSON.stringify(value, null, 2);
        }

        function waitForGafaig(callback) {
          var attempts = 0;

          var timer = window.setInterval(function () {
            if (window.gafaig) {
              window.clearInterval(timer);
              callback(window.gafaig);
              return;
            }

            attempts += 1;

            if (attempts >= MAX_ATTEMPTS) {
              window.clearInterval(timer);
              writeResult("GAFAIG SDK not loaded");
            }
          }, ATTEMPT_DELAY_MS);
        }

        function waitForVerifyModal(callback) {
          var attempts = 0;

          var timer = window.setInterval(function () {
            if (window.verifyGAFAIG) {
              window.clearInterval(timer);
              callback(window.verifyGAFAIG);
              return;
            }

            attempts += 1;

            if (attempts >= MAX_ATTEMPTS) {
              window.clearInterval(timer);
              writeResult("GAFAIG verification modal not loaded");
            }
          }, ATTEMPT_DELAY_MS);
        }

        window.addEventListener("load", function () {
          waitForGafaig(function (gafaig) {
            gafaig.init({
              baseUrl: BASE_URL
            });

            var sdkButton = document.getElementById("test-sdk");

            if (sdkButton) {
              sdkButton.addEventListener("click", function () {
                writeResult("Loading GAFAIG badge JSON...");

                gafaig
                  .getBadge(REGISTRY_ID, {
                    baseUrl: BASE_URL
                  })
                  .then(function (result) {
                    writeResult(result);
                  })
                  .catch(function (error) {
                    writeResult(
                      error && error.message
                        ? error.message
                        : "GAFAIG SDK request failed"
                    );
                  });
              });
            }
          });

          waitForVerifyModal(function (verifyGAFAIG) {
            var modalButton = document.getElementById("open-gafaig-modal");

            if (modalButton) {
              modalButton.addEventListener("click", function () {
                verifyGAFAIG(REGISTRY_ID, {
                  baseUrl: BASE_URL
                });
              });
            }
          });
        });
      })();
    </script>
  </body>
</html>
