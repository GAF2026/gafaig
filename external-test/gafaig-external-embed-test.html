<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GAFAIG External Embed Test</title>

    <style>
      body {
        font-family: Inter, Arial, sans-serif;
        margin: 40px;
        background: #f7f7f7;
        color: #111;
      }

      .card {
        max-width: 860px;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 24px;
        padding: 28px;
      }

      .section {
        margin-top: 28px;
      }

      .row {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      button,
      a.gafaig-test-link {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        background: #fff;
        font-weight: 700;
        cursor: pointer;
        color: #111;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      pre {
        margin-top: 20px;
        padding: 16px;
        border-radius: 16px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: #fafafa;
        overflow-x: auto;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.6;
      }

      .status {
        margin-top: 16px;
        font-size: 13px;
        color: #555;
      }

      .test-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
        gap: 24px;
        align-items: start;
      }

      @media (max-width: 820px) {
        .test-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>GAFAIG External Embed Test</h1>

      <p>
        This simulates a third-party site using production GAFAIG scripts and
        APIs.
      </p>

      <div class="test-grid">
        <div>
          <div class="section">
            <h3>Badge</h3>
            <div data-gafaig-badge="GAFAIG-00363095"></div>
          </div>

          <div class="section">
            <h3>Full Widget</h3>
            <div data-gafaig-id="GAFAIG-00363095"></div>
          </div>
        </div>

        <div>
          <div class="section">
            <h3>Compact Widget</h3>
            <div data-gafaig-id="GAFAIG-00363095" data-mode="badge"></div>
          </div>

          <div class="row">
            <button id="open-gafaig-modal" type="button">
              Open Verification Modal
            </button>

            <button id="direct-verify-modal" type="button">
              Direct window.verifyGAFAIG Test
            </button>

            <button id="test-sdk" type="button">
              Test SDK Verify
            </button>

            <button id="test-badge" type="button">
              Test Badge API
            </button>
          </div>

          <div class="status" id="load-status">Loading GAFAIG scripts…</div>

          <pre id="sdk-result"></pre>
        </div>
      </div>
    </div>

    <script src="https://www.gafaig.com/sdk/gafaig.v1.js"></script>
    <script src="https://www.gafaig.com/widget/gafaig-widget.v1.js"></script>
    <script src="https://www.gafaig.com/widget/gafaig-verify.v1.js"></script>

    <script>
      (function () {
        var BASE_URL = "https://www.gafaig.com";
        var REGISTRY_ID = "GAFAIG-00363095";
        var MAX_ATTEMPTS = 50;
        var ATTEMPT_DELAY_MS = 100;

        function setStatus(value) {
          var statusBox = document.getElementById("load-status");
          if (statusBox) statusBox.textContent = value;
        }

        function writeResult(value) {
          var resultBox = document.getElementById("sdk-result");
          if (!resultBox) return;

          if (typeof value === "string") {
            resultBox.textContent = value;
            return;
          }

          resultBox.textContent = JSON.stringify(value, null, 2);
        }

        function waitForGafaig(callback) {
          var attempts = 0;

          var timer = window.setInterval(function () {
            if (window.gafaig) {
              window.clearInterval(timer);
              callback(window.gafaig);
              return;
            }

            attempts += 1;

            if (attempts >= MAX_ATTEMPTS) {
              window.clearInterval(timer);
              setStatus("GAFAIG SDK not loaded.");
              writeResult("GAFAIG SDK not loaded");
            }
          }, ATTEMPT_DELAY_MS);
        }

        function waitForVerifyModal(callback) {
          var attempts = 0;

          var timer = window.setInterval(function () {
            if (typeof window.verifyGAFAIG === "function") {
              window.clearInterval(timer);
              callback(window.verifyGAFAIG);
              return;
            }

            attempts += 1;

            if (attempts >= MAX_ATTEMPTS) {
              window.clearInterval(timer);
              setStatus("GAFAIG verification modal not loaded.");
              writeResult("GAFAIG verification modal not loaded");
            }
          }, ATTEMPT_DELAY_MS);
        }

        function waitForWidget(callback) {
          var attempts = 0;

          var timer = window.setInterval(function () {
            if (window.GAFAIGWidget && typeof window.GAFAIGWidget.mount === "function") {
              window.clearInterval(timer);
              callback(window.GAFAIGWidget);
              return;
            }

            attempts += 1;

            if (attempts >= MAX_ATTEMPTS) {
              window.clearInterval(timer);
              setStatus("GAFAIG widget not loaded.");
              writeResult("GAFAIG widget not loaded");
            }
          }, ATTEMPT_DELAY_MS);
        }

        window.addEventListener("load", function () {
          waitForGafaig(function (gafaig) {
            setStatus(
              "GAFAIG SDK loaded. gafaig.version = " +
                String(gafaig.version || "unknown")
            );

            gafaig.init({
              baseUrl: BASE_URL
            });

            var sdkButton = document.getElementById("test-sdk");
            var badgeButton = document.getElementById("test-badge");

            if (sdkButton) {
              sdkButton.addEventListener("click", function () {
                writeResult("Loading GAFAIG verification JSON...");

                gafaig
                  .verify(REGISTRY_ID, {
                    baseUrl: BASE_URL
                  })
                  .then(function (result) {
                    writeResult(result);
                  })
                  .catch(function (error) {
                    writeResult(
                      error && error.message
                        ? error.message
                        : "GAFAIG SDK verify request failed"
                    );
                  });
              });
            }

            if (badgeButton) {
              badgeButton.addEventListener("click", function () {
                writeResult("Loading GAFAIG badge JSON...");

                gafaig
                  .getBadge(REGISTRY_ID, {
                    baseUrl: BASE_URL
                  })
                  .then(function (result) {
                    writeResult(result);
                  })
                  .catch(function (error) {
                    writeResult(
                      error && error.message
                        ? error.message
                        : "GAFAIG badge request failed"
                    );
                  });
              });
            }
          });

          waitForWidget(function (widget) {
            widget.mount();
          });

          waitForVerifyModal(function (verifyGAFAIG) {
            setStatus(
              "GAFAIG SDK + widget + verification modal loaded. Ready for external verification."
            );

            var modalButton = document.getElementById("open-gafaig-modal");
            var directButton = document.getElementById("direct-verify-modal");

            if (modalButton) {
              modalButton.addEventListener("click", function () {
                verifyGAFAIG(REGISTRY_ID, {
                  baseUrl: BASE_URL
                })
                  .then(function (result) {
                    writeResult(result);
                  })
                  .catch(function (error) {
                    writeResult(
                      error && error.message
                        ? error.message
                        : "GAFAIG verification modal failed"
                    );
                  });
              });
            }

            if (directButton) {
              directButton.addEventListener("click", function () {
                if (typeof window.verifyGAFAIG !== "function") {
                  writeResult("window.verifyGAFAIG is not available");
                  return;
                }

                window
                  .verifyGAFAIG(REGISTRY_ID, {
                    baseUrl: BASE_URL
                  })
                  .then(function (result) {
                    writeResult({
                      directCall: "window.verifyGAFAIG",
                      registryId: REGISTRY_ID,
                      result: result
                    });
                  })
                  .catch(function (error) {
                    writeResult(
                      error && error.message
                        ? error.message
                        : "Direct window.verifyGAFAIG call failed"
                    );
                  });
              });
            }
          });
        });
      })();
    </script>
  </body>
</html>
